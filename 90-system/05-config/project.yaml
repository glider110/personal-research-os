project:
  id: personal-research-os
  name: 因果研究台
  version: 0.1.0
  language: zh-CN
  timezone: Asia/Shanghai

storage:
  source_archive: google-drive
  metadata_store: sqlite
  time_series_store: parquet
  version_control: git
  source_layout: "02-sources/{topic}/{type}/{source_id}/{snapshot_id}/{filename}"
  source_types: [video, audio, pdf, md, txt, image, url, excel, csv, word, ppt, json, other]

defaults:
  review_frequency: monthly
  confidence_levels: [low, medium, high]
  scenario_types: [base, upside, stress]
  immutable_snapshots: true
